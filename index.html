<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c0c0e">
  <meta name="description" content="Kino — каталог фильмов и сериалов">
  <title>Kino</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e50914'/><polygon points='38,28 38,72 72,50' fill='white'/></svg>">
</head>
<body>
  <div class="layout">
    <header class="header">
      <a href="./" class="logo">
        <span class="logo__icon" aria-hidden="true">▶</span>
        <span class="logo__text">Kino</span>
      </a>
      <form class="header-search" id="headerSearch" role="search">
        <input type="search" id="headerInput" placeholder="Название или ID" autocomplete="off">
        <button type="submit" aria-label="Искать">⌕</button>
      </form>
    </header>

    <main class="main">
      <section class="hero">
        <h1>Фильмы и сериалы</h1>
        <p class="hero__sub">Поиск по названию или ID Кинопоиска</p>
        <form id="mainSearch" class="search-box">
          <input type="search" id="mainInput" placeholder="Название или ID" autocomplete="off" autofocus>
          <button type="submit" class="btn-primary">Найти</button>
        </form>
        <div class="search-modes">
          <label><input type="radio" name="mode" value="name" checked> По названию</label>
          <label><input type="radio" name="mode" value="id"> По ID</label>
        </div>
      </section>

      <section id="searchResults" class="section" hidden>
        <div class="section__head">
          <h2 id="resultsTitle">Результаты</h2>
          <button type="button" class="btn-text" id="clearResults">Скрыть</button>
        </div>
        <div id="resultsGrid" class="grid"></div>
        <p id="resultsEmpty" class="empty" hidden>Ничего не найдено</p>
        <p id="resultsError" class="error" hidden></p>
      </section>

      <section class="section">
        <div class="section__head">
          <h2>Популярное</h2>
        </div>
        <div id="popularGrid" class="grid">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
        <p id="popularError" class="error" hidden></p>
      </section>

      <section class="section">
        <div class="section__head">
          <h2>Топ рейтинга</h2>
        </div>
        <div id="topGrid" class="grid">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
        <p id="topError" class="error" hidden></p>
      </section>
    </main>

    <footer class="footer">
      <a href="./copyright.html">Правообладателям</a>
      <span>·</span>
      <span>2026</span>
      <span>·</span>
      <span id="liveinternet-counter"></span>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/home.js"></script>
  <script src="js/liveinternet.js"></script>
</body>
</html>
