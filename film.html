<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c0c0e">
  <meta name="referrer" content="no-referrer-when-downgrade">
  <title>Фильм — КиноПлёнка</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e50914'/><polygon points='38,28 38,72 72,50' fill='white'/></svg>">
  <script src="https://graphicslab.io/sdk/v2/rendex-sdk.min.js" async></script>
  <script src="https://alt.graphicslab.io/sdk/v2/rendex-sdk.min.js" async></script>
</head>
<body>
  <div class="layout">
    <header class="header">
      <a href="./" class="logo">
        <span class="logo__icon" aria-hidden="true">▶</span>
        <span class="logo__text">КиноПлёнка</span>
      </a>
      <form class="header-search" id="headerSearch" role="search">
        <input type="search" id="headerInput" placeholder="Название или ID" autocomplete="off" maxlength="200">
        <button type="submit" aria-label="Искать">⌕</button>
      </form>
    </header>

    <main class="main film-page" id="filmPage">
      <div class="film-loading" id="filmLoading">Загрузка…</div>

      <div id="filmContent" hidden>
        <div class="player-wrap">
          <div class="player" id="player"></div>
        </div>

        <div class="film-layout">
          <div class="film-poster-col">
            <img id="filmPoster" class="film-poster" src="" alt="" referrerpolicy="no-referrer">
          </div>
          <div class="film-info">
            <h1 id="filmTitle" class="film-title"></h1>
            <p id="filmOriginal" class="film-original"></p>
            <div class="film-meta" id="filmMeta"></div>
            <div class="film-rating" id="filmRating" hidden></div>
            <p id="filmGenres" class="film-genres"></p>
            <p id="filmDescription" class="film-desc"></p>

            <div class="film-actions">
              <a id="filmTrailer" class="btn-primary" href="#" target="_blank" rel="noopener noreferrer" hidden>Трейлер</a>
              <a id="filmKp" class="btn-outline" href="#" target="_blank" rel="noopener noreferrer">Кинопоиск</a>
            </div>
          </div>
        </div>

        <section class="section" id="similarSection" hidden>
          <h2>Похожие</h2>
          <div id="similarGrid" class="grid"></div>
        </section>
      </div>

      <p id="filmError" class="error" hidden></p>
    </main>

    <footer class="footer">
      <a href="./copyright.html">Правообладателям</a>
      <span>·</span>
      <span>2026</span>
      <span>·</span>
      <span id="liveinternet-counter"></span>
    </footer>
  </div>

  <script src="js/app-film.js" defer></script>
</body>
</html>
