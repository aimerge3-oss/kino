<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c0c0e">
  <title>Фильм — Kino</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e50914'/><polygon points='38,28 38,72 72,50' fill='white'/></svg>">
</head>
<body>
  <div class="layout">
    <header class="header">
      <a href="./" class="logo">
        <span class="logo__icon" aria-hidden="true">▶</span>
        <span class="logo__text">Kino</span>
      </a>
      <form class="header-search" id="headerSearch" role="search">
        <input type="search" id="headerInput" placeholder="Название или ID" autocomplete="off">
        <button type="submit" aria-label="Искать">⌕</button>
      </form>
    </header>

    <main class="main film-page" id="filmPage">
      <div class="film-loading" id="filmLoading">Загрузка…</div>

      <div id="filmContent" hidden>
        <div class="player-wrap">
          <div class="player" id="player">
            <div class="player__placeholder" id="playerPlaceholder">
              <span class="player__icon">▶</span>
              <p>Плеер</p>
              <p class="player__hint">Вставь свой плеер в <code>#player</code></p>
            </div>
          </div>
        </div>

        <div class="film-layout">
          <div class="film-poster-col">
            <img id="filmPoster" class="film-poster" src="" alt="">
          </div>
          <div class="film-info">
            <h1 id="filmTitle" class="film-title"></h1>
            <p id="filmOriginal" class="film-original"></p>
            <div class="film-meta" id="filmMeta"></div>
            <div class="film-rating" id="filmRating" hidden></div>
            <p id="filmGenres" class="film-genres"></p>
            <p id="filmDescription" class="film-desc"></p>

            <div class="film-actions">
              <a id="filmTrailer" class="btn-primary" href="#" target="_blank" rel="noopener" hidden>Трейлер</a>
              <a id="filmKp" class="btn-outline" href="#" target="_blank" rel="noopener">Кинопоиск</a>
            </div>
          </div>
        </div>

        <section class="section ai-block" id="aiBlock" hidden>
          <h2>Улучшенное описание</h2>
          <div id="aiText" class="ai-text"></div>
        </section>

        <section class="section" id="similarSection" hidden>
          <h2>Похожие</h2>
          <div id="similarGrid" class="grid"></div>
        </section>
      </div>

      <p id="filmError" class="error" hidden></p>
    </main>

    <footer class="footer">
      <a href="./copyright.html">Правообладателям</a>
      <span>·</span>
      <span>2026</span>
      <span>·</span>
      <span id="liveinternet-counter"></span>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/film.js"></script>
  <script src="js/liveinternet.js"></script>
</body>
</html>
